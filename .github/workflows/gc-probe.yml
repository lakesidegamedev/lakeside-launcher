name: gc registry probe

on:
  push:
    branches: ['release/0.7.1']
    paths: ['.github/workflows/gc-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Silent install of the released Grand Century setup and dump what it registers
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $m = Invoke-RestMethod https://lakesidegames.net/download/launcher/manifest.json
          $a = $m.products.'grand-century-desktop'.artifacts.'windows-x64'
          "version " + $m.products.'grand-century-desktop'.version + " url " + $a.url
          $file = Join-Path $env:RUNNER_TEMP 'gc-setup.exe'
          Invoke-WebRequest -Uri $a.url -OutFile $file
          $sha = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "sha256 actual=$sha manifest=" + $a.sha256
          $before = Get-ChildItem $env:APPDATA, $env:LOCALAPPDATA -Recurse -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          Start-Process -FilePath $file -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 3
          foreach ($hive in 'HKCU:', 'HKLM:', 'HKLM:\SOFTWARE\WOW6432Node') {
            $path = if ($hive -eq 'HKLM:\SOFTWARE\WOW6432Node') { "$hive\Microsoft\Windows\CurrentVersion\Uninstall\*" } else { "$hive\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" }
            Get-ItemProperty $path -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -match 'grand|century|lakeside' -or $_.Publisher -match 'lakeside|grand' } | ForEach-Object {
              "---- $hive key " + $_.PSChildName
              $_ | Format-List DisplayName, Publisher, DisplayVersion, InstallLocation, DisplayIcon, UninstallString, QuietUninstallString, URLInfoAbout | Out-String
            }
          }
          "---- install dir listing"
          Get-ChildItem "$env:LOCALAPPDATA\GrandCentury" -Recurse -Force -ErrorAction SilentlyContinue | Select-Object -First 40 FullName, Length | Format-Table -AutoSize | Out-String -Width 200
          $exe = Get-ChildItem "$env:LOCALAPPDATA\GrandCentury" -Filter *.exe -ErrorAction SilentlyContinue | Where-Object { $_.Name -notmatch 'uninstall' }
          $exe | ForEach-Object { "exe: " + $_.FullName }
          $p = Start-Process -FilePath ($exe | Select-Object -First 1).FullName -PassThru
          Start-Sleep -Seconds 20
          "alive after 20s: " + (-not $p.HasExited)
          Get-Process | Where-Object { $_.Name -match 'grand' } | Select-Object Name, Id | Format-Table | Out-String
          "---- files created outside the install dir"
          $after = Get-ChildItem $env:APPDATA, $env:LOCALAPPDATA -Recurse -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          Compare-Object $before $after | Where-Object { $_.SideIndicator -eq '=>' -and $_.InputObject -notmatch 'GrandCentury\\|Temp\\' } | Select-Object -First 60 -ExpandProperty InputObject
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
