name: update e2e

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: windows-latest
    steps:
      - name: Install 0.3.1, run the headless updater, verify 0.3.2
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'

          function Get-LauncherEntry {
            Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -eq 'Lakeside' } |
              Select-Object -First 1
          }

          $url = 'https://lakesidegames.net/download/launcher/Lakeside_0.3.1_x64-setup.exe'
          $file = Join-Path $env:RUNNER_TEMP 'Lakeside-setup.exe'
          Invoke-WebRequest -Uri $url -OutFile $file
          Start-Process -FilePath $file -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5

          $entry = Get-LauncherEntry
          "installed=" + $entry.DisplayVersion
          "installLocation=" + $entry.InstallLocation
          Get-ChildItem -Path $entry.InstallLocation -Recurse -File | Select-Object FullName | Format-Table -AutoSize
          if ($entry.DisplayVersion -ne '0.3.1') { throw '0.3.1 did not install' }

          $exe = Get-ChildItem -Path $entry.InstallLocation -Recurse -Filter '*.exe' |
            Where-Object { $_.Name -notmatch 'uninstall' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw 'launcher executable not found' }
          "exe=$exe"

          Start-Process -FilePath $exe -ArgumentList '--headless-update' -Wait

          for ($i = 0; $i -lt 90; $i++) {
            $version = (Get-LauncherEntry).DisplayVersion
            "poll $i version=$version"
            if ($version -eq '0.3.2') { break }
            Start-Sleep -Seconds 2
          }

          $final = (Get-LauncherEntry).DisplayVersion
          "updated=" + $final
          if ($final -ne '0.3.2') { throw "expected 0.3.2, got $final" }
