name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:web

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run build:web
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --lib --manifest-path src-tauri/Cargo.toml

  # Starts the real app under a virtual display: the window loads and the
  # process exits cleanly. Catches a launcher that builds but does not start.
  smoke-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run build:web
      - run: cargo build --manifest-path src-tauri/Cargo.toml --features custom-protocol
      - name: Smoke check
        run: timeout 150 xvfb-run -a src-tauri/target/debug/lakeside-launcher --smoke

  # Drives every screen of the built UI in headless Chrome on Linux, checks the
  # text players must see and keeps a screenshot of each screen.
  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: npm install --no-save --no-audit --no-fund playwright-core
      - run: node e2e/ui-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-smoke-shots
          path: ui-smoke-shots
          if-no-files-found: ignore

  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run build:web
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo check --examples --manifest-path src-tauri/Cargo.toml
