[package]
name = "lakeside-launcher"
version = "0.2.0"
description = "The Lakeside Games launcher"
authors = ["Lakeside Games"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lakeside_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
base64 = "0.22"
ed25519-dalek = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
rand = "0.8"

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
minisign-verify = "0.3"
